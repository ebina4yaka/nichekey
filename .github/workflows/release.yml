name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # mozc_dict.bin はリポジトリ外なのでCIで再生成する
      - name: Build Mozc dictionary
        run: |
          mkdir -p third_party/mozc
          for i in 00 01 02 03 04 05 06 07 08 09; do
            curl -sfL -o third_party/mozc/dictionary$i.txt \
              https://raw.githubusercontent.com/google/mozc/master/src/data/dictionary_oss/dictionary$i.txt
          done
          python3 tools/build_mozc_dict.py

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/JpKeyboard-${GITHUB_REF_NAME}.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JpKeyboard-*.apk
          generate_release_notes: true
